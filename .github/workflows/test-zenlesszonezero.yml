name: Test Zenless Zone Zero API
on:
  push:
    branches: [zenlesszonezero-api]
  pull_request:
    branches: [zenlesszonezero-api]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
