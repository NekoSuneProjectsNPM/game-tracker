name: Build and prepare tracker release

on:
  push:
    branches-ignore: [main, TEMPLATE]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.ref_name != 'main' && github.ref_name != 'TEMPLATE' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Require release workflow trigger token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Set RELEASE_TOKEN (fine-grained PAT or GitHub App token with repository Contents write). Releases created by GITHUB_TOKEN do not trigger release-published workflows."
            exit 1
          fi

      - name: Checkout tracker branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Verify tracker branch identity and package
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const branch = process.env.GITHUB_REF_NAME;
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (!/^[a-z0-9][a-z0-9._-]*$/.test(branch) || ['main','TEMPLATE'].includes(branch)) throw Error('Invalid tracker branch');
          if (p.name !== '@nekosuneprojects/' + branch) throw Error('Package name must exactly match tracker branch');
          NODE
          npm run check
          npm ci
          npm test
          npm pack --dry-run

      - name: Choose a not-yet-published npm version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw Error('Stable semver x.y.z required');
          const parse = v => v.split('.').map(Number);
          const compare = (a,b) => a[0]-b[0] || a[1]-b[1] || a[2]-b[2];
          try {
            const response = cp.execFileSync('npm', ['view', p.name, 'version', '--json'], { encoding: 'utf8', stdio: ['ignore','pipe','pipe'] }).trim();
            if (response) {
              const published = JSON.parse(response);
              const known = Array.isArray(published) ? published.at(-1) : published;
              if (!/^\d+\.\d+\.\d+$/.test(known)) throw Error('Unexpected published semver');
              if (compare(parse(p.version),parse(known)) <= 0) {
                const n = parse(known); n[2]++; p.version = n.join('.');
              }
            }
          } catch (e) {
            if (!/E404|404 Not Found/.test(String(e.stderr || ''))) throw e;
          }
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE

      - name: Update lockfile and retest versioned package
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm test
          npm pack --dry-run

      - name: Commit version and publish branch-specific GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./package.json').name")
          TAG="${GITHUB_REF_NAME}-v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --target "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME} v${VERSION}" --notes "Release ${PKG}@${VERSION}. Individual package README documents endpoints and setup."
