name: Test and publish tracker package

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name != 'main' && github.ref_name != 'TEMPLATE' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate branch and package
        shell: bash
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const branch = process.env.GITHUB_REF_NAME;
          if (!/^[a-z0-9][a-z0-9._-]*$/.test(branch)) throw Error('Use a simple tracker branch name.');
          if (p.name !== '@nekosuneprojects/' + branch) throw Error('Package name must match the branch: @nekosuneprojects/' + branch);
          NODE
          npm run check
          npm test
          npm pack --dry-run
      - name: Verify npm publishing is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Set the NPM_TOKEN repository Actions secret before publishing tracker branches."
            exit 1
          fi
      - name: Select new package version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parse = v => v.split('.').map(Number);
          const compare = (a, b) => { for (let i=0;i<3;i++) if(a[i] !== b[i]) return a[i]-b[i]; return 0; };
          if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw Error('Use stable x.y.z version for automated releases.');
          let published = null;
          try {
            const raw = cp.execFileSync('npm', ['view', p.name, 'version', '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
            if (raw) published = JSON.parse(raw);
            if (Array.isArray(published)) published = published.at(-1);
          } catch (e) {
            // 404 is normal for a first release; network/auth issues must not be treated as 404.
            const err = (e.stderr || '').toString();
            if (!/E404|404 Not Found/.test(err)) throw e;
          }
          const current = parse(p.version);
          let next = current;
          if (published && compare(current, parse(published)) <= 0) {
            next = parse(published);
            next[2]++;
          }
          p.version = next.join('.');
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          console.log('Publishing ' + p.name + '@' + p.version);
          NODE
      - name: Re-test and publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run check
          npm test
          npm publish --access public
      - name: Commit version and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          TAG="${GITHUB_REF_NAME}-v${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --target "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME} v${VERSION}" --notes "Published package: $(node -p "require('./package.json').name")@${VERSION}"
