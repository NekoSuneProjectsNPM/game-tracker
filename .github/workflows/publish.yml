name: Manually publish tracker version

on:
  workflow_dispatch:
    inputs:
      tracker_branch:
        description: "Tracker branch (not main or TEMPLATE)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-tracker-${{ inputs.tracker_branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch selection
        env:
          TRACKER_BRANCH: ${{ inputs.tracker_branch }}
        run: |
          node - <<'NODE'
          const b=process.env.TRACKER_BRANCH;
          if (!/^[a-z0-9][a-z0-9._-]*$/.test(b) || ['main','TEMPLATE'].includes(b))
            throw Error('Invalid tracker branch: main and TEMPLATE cannot be released');
          NODE
      - name: Checkout selected tracker
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tracker_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Verify package version and lockfile
        env:
          TRACKER_BRANCH: ${{ inputs.tracker_branch }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(p.name!=='@nekosuneprojects/'+process.env.TRACKER_BRANCH)
            throw Error('Package name must match selected branch');
          if(!/^\d+\.\d+\.\d+$/.test(p.version))
            throw Error('Version must be stable x.y.z');
          if(l.name!==p.name || l.version!==p.version || l.packages?.['']?.name!==p.name || l.packages?.['']?.version!==p.version)
            throw Error('package-lock.json does not match package.json. Update and commit both manually');
          fs.appendFileSync(process.env.GITHUB_ENV,'RELEASE_TAG='+process.env.TRACKER_BRANCH+'-v'+p.version+'\nPKG='+p.name+'\nVERSION='+p.version+'\n');
          NODE
      - name: Validate package
        run: |
          npm ci
          npm run check
          npm test
          npm pack --dry-run
      - name: Check release credentials
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || { echo "::error::Set RELEASE_TOKEN with Contents write permission"; exit 1; }
      - name: Publish GitHub Release (triggers both registries)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TRACKER_BRANCH: ${{ inputs.tracker_branch }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag already exists. Manually bump package.json and lockfile version."
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/${TRACKER_BRANCH}:refs/remotes/origin/${TRACKER_BRANCH}" --quiet
          test "$SOURCE_SHA" = "$(git rev-parse "refs/remotes/origin/${TRACKER_BRANCH}")" || { echo "::error::Tracker branch changed. Run again."; exit 1; }
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "${TRACKER_BRANCH} v${VERSION}" --notes "Manual release of ${PKG}@${VERSION}; version read exactly from package.json." --latest=false
